name: Build & Release Orange Pi Zero 3 iStoreOS

on:
  workflow_dispatch:
    inputs:
      verbose_retry:
        description: "并行编译失败后使用 make -j1 V=s 重试"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: orangepi-zero3-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Orange Pi Zero 3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show runner resources
        run: |
          echo "=== CPU ==="
          nproc

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

          echo "=== Disk after cleanup ==="
          df -h

          echo "=== Existing swap ==="
          swapon --show || true
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            bc \
            time \
            xsltproc \
            zstd \
            ccache \
            libfuse-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            device-tree-compiler

      - name: Cache downloaded source archives
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf', 'feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Orange Pi Zero 3 build config
        run: |
          cp configs/orangepi-zero3-istoreos.config .config

          make defconfig

          echo "=== Target ==="
          grep -E '^CONFIG_TARGET_sunxi|^CONFIG_TARGET_PROFILE' .config || true

          echo "=== RootFS ==="
          grep -E '^CONFIG_TARGET_ROOTFS|^# CONFIG_TARGET_ROOTFS' .config || true

          echo "=== Important packages ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|tailscale|docker|dockerd|docker-compose|luci-app-dockerman|luci-app-partexp|luci-app-netwizard|luci-app-quickstart)=' .config || true

      - name: Verify Orange Pi Zero 3 permanent fixes
        run: |
          echo "=== Verify YT8531C patch ==="

          test -f \
            target/linux/sunxi/patches-6.6/103-orangepi-zero3-yt8531-phy-stability.patch

          grep -q 'motorcomm,auto-sleep-disabled' \
            target/linux/sunxi/patches-6.6/103-orangepi-zero3-yt8531-phy-stability.patch

          grep -q 'motorcomm,keep-pll-enabled' \
            target/linux/sunxi/patches-6.6/103-orangepi-zero3-yt8531-phy-stability.patch

          echo "=== Verify SPI0 disabled patch ==="

          test -f \
            target/linux/sunxi/patches-6.6/104-orangepi-zero3-disable-spi0.patch

          grep -q 'status = "disabled"' \
            target/linux/sunxi/patches-6.6/104-orangepi-zero3-disable-spi0.patch

          echo "=== Verify bypass-router defaults ==="

          test -x files/etc/uci-defaults/99-bypass-router

          grep -q "network.lan.device='eth0'" \
            files/etc/uci-defaults/99-bypass-router

          grep -q "network.lan.proto='dhcp'" \
            files/etc/uci-defaults/99-bypass-router

          echo "=== Verify Mihomo ==="

          test -x files/etc/openclash/core/clash_meta

          sha256sum files/etc/openclash/core/clash_meta

          echo "Expected:"
          echo "9e0f11afbf38426b8bd88fdc594678f8161c57eccb4e1b77acb12b493904f1d4"

          echo \
            "9e0f11afbf38426b8bd88fdc594678f8161c57eccb4e1b77acb12b493904f1d4  files/etc/openclash/core/clash_meta" \
            | sha256sum -c -

      - name: Download sources
        shell: bash
        run: |
          set +e

          make download -j4
          rc=$?

          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::warning::Parallel download failed, retrying serially"
            make download -j1 V=s
          fi

          # 删除异常的小下载文件，让 make 后续能够重新获取
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        shell: bash
        run: |
          set +e

          make -j$(nproc)
          rc=$?

          set -e

          if [ "$rc" -ne 0 ]; then
            if [ "${{ inputs.verbose_retry }}" = "true" ]; then
              echo "::warning::Parallel build failed, retrying with make -j1 V=s"
              make -j1 V=s
            else
              exit "$rc"
            fi
          fi

      - name: Verify firmware output
        run: |
          OUT="bin/targets/sunxi/cortexa53"

          echo "=== Firmware output ==="
          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f  %k KiB\n' \
            | sort

          echo "=== Looking for Orange Pi Zero 3 image ==="

          IMAGE_COUNT="$(
            find "$OUT" \
              -maxdepth 1 \
              -type f \
              -name '*orangepi-zero3*.img.gz' \
              | wc -l
          )"

          echo "Found $IMAGE_COUNT Orange Pi Zero 3 image(s)"

          if [ "$IMAGE_COUNT" -lt 1 ]; then
            echo "::error::Orange Pi Zero 3 sdcard image was not generated"
            exit 1
          fi

      - name: Prepare Release files
        id: release_info
        shell: bash
        run: |
          OUT="bin/targets/sunxi/cortexa53"

          mkdir -p release

          # 只复制 target 目录顶层的最终固件及构建信息，
          # 不复制 packages/ 等大目录。
          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -exec cp -av {} release/ \;

          DATE="$(date -u +'%Y%m%d')"
          TAG="orangepi-zero3-${DATE}-r${GITHUB_RUN_NUMBER}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "Orange Pi Zero 3 iStoreOS cloud build"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_RUN_NUMBER"
            echo "Build time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Target: sunxi/cortexa53"
            echo "Device: Xunlong Orange Pi Zero 3"
            echo "Kernel: Linux 6.6"
            echo
            echo "Included project fixes:"
            echo "- Three-partition SquashFS + ext4 Overlay image layout"
            echo "- Motorcomm YT8531C PHY stability patch"
            echo "- Onboard SPI0 disabled"
            echo "- Single-port bypass-router defaults"
            echo "- OpenClash + Mihomo"
            echo "- Tailscale"
            echo "- Docker / Dockerman"
            echo "- PartExp"
          } > release/GITHUB_BUILD_INFO.txt

          cat > RELEASE_NOTES.md <<EOF
          ## Orange Pi Zero 3 iStoreOS

          Automated firmware build from branch \`$GITHUB_REF_NAME\`.

          **Commit**

          \`$GITHUB_SHA\`

          **Target**

          - SoC: Allwinner H618
          - OpenWrt target: \`sunxi/cortexa53\`
          - Device: Orange Pi Zero 3
          - RootFS: SquashFS
          - Writable Overlay: separate ext4 partition

          **Orange Pi Zero 3 fixes included**

          - YT8531C Gigabit Ethernet stability settings
          - SPI0 disabled to avoid the previously observed sun6i SPI panic path
          - Three-partition SD-card image
          - Single-port bypass-router defaults
          - OpenClash / Mihomo
          - Tailscale
          - Docker / Dockerman
          - PartExp

          This release was built automatically by GitHub Actions.
          EOF

          echo "=== Release files ==="
          ls -lh release/

      - name: Create GitHub Release
        if: github.ref_name == 'orangepi-zero3'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          echo "Creating release: $TAG"

          gh release create "$TAG" \
            release/* \
            --target "$GITHUB_SHA" \
            --title "Orange Pi Zero 3 iStoreOS ${TAG}" \
            --notes-file RELEASE_NOTES.md

      - name: Final summary
        if: success()
        env:
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          echo "### Orange Pi Zero 3 build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Firmware has been published to GitHub Releases." >> "$GITHUB_STEP_SUMMARY"

      - name: Show disk usage
        if: always()
        run: |
          echo "=== Final disk usage ==="
          df -h
